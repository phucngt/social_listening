# Danh sách nguồn theo dõi. enabled: false = bỏ qua, không tính là nguồn được cấu hình.
# max_age_days: nội dung đăng cũ hơn số ngày này chỉ được đánh dấu "đã thấy", không gửi AI
# (tránh lần chạy đầu kéo về hàng trăm bài cũ). Có thể ghi đè trong từng nguồn.
max_age_days: 7

sources:
  - id: google_news_ysvn
    type: google_news
    enabled: true
    group_name: "Google News"
    queries:
      - '"Yuanta Việt Nam"'
      - '"Chứng khoán Yuanta"'
      - 'YSVN chứng khoán'
      - 'YSflex'

  # Nhập tay: copy bài từ nhóm FB/Zalo vào inbox/*.jsonl (xem inbox/README.md)
  - id: manual_inbox
    type: manual
    enabled: true
    path: inbox

  # Chưa bật — chờ DM cung cấp danh sách nhóm và tài khoản công ty được duyệt.
  # YouTube: RSS theo kênh (không cần key) + YouTube Data API (tìm theo từ khóa, lấy lượt xem).
  # API key lấy từ GitHub Secret YOUTUBE_API_KEY — chỉ có khi chạy trong GitHub Actions.
  - id: youtube
    type: youtube
    enabled: true
    api_key_env: YOUTUBE_API_KEY
    channels: []            # channel_id các kênh chứng khoán theo dõi cố định (dạng UCxxxx), đọc qua RSS
    lookback_hours: 48      # chỉ tìm video đăng trong khoảng này
    search_every_hours: 3   # mỗi query gọi search tối đa 1 lần / 3 giờ (100 đơn vị hạn mức mỗi lần)
    exclude_channels:       # kênh của Yuanta nước ngoài (cùng tập đoàn, không phải YSVN)
      - Yuanta Securities Thailand
      - Yuantakorea
      - 유안타
    comments_per_video: 100     # 100 bình luận mới nhất / video = 1 đơn vị hạn mức; 0 = tắt
    comments_max_videos: 30     # tối đa số video lấy bình luận mỗi lần (ưu tiên video nhiều bình luận)
    title_only_groups: [competitor]   # tên đối thủ chỉ tính khi nằm trong tiêu đề (mô tả hay có link mở TK VPS...)
    queries:
      - {q: "Yuanta Việt Nam", order: date}   # lớp 2: nhắc tới YSVN
      - {q: "YSVN", order: date}
      - {q: "YSflex", order: date}
      - {q: "chứng khoán", order: viewCount}  # lớp 1: video thị trường xem nhiều nhất
      - {q: "VN-Index", order: viewCount}
    hot:                    # lớp 1 — "tin hot" dù không nhắc YSVN
      min_views: 50000
      min_views_per_hour: 2000
      watch_hours: 24       # video < 24h chưa hot: lần sau đánh giá lại lượt xem

  # Facebook group: phiên đăng nhập (storage_state JSON) lấy từ GitHub Secret FB_STORAGE_STATE.
  # Xuất phiên trên máy cá nhân: python scripts/export_fb_session.py
  - id: fb_gieo_mam_tich_san
    type: facebook
    enabled: false
    group_name: "Gieo mầm tích sản"
    url: "TODO: https://www.facebook.com/groups/<id>"
    storage_state_env: FB_STORAGE_STATE
    max_scrolls: 5
    hot:
      min_comments: 30

  - id: zalo_group_example
    type: zalo
    enabled: false
    group_name: "TODO: tên nhóm"
    storage_state_env: ZALO_STORAGE_STATE
